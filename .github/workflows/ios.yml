name: iOS build

on:
  push:
    paths:
      - 'frontend/ios/**'
      - 'frontend/lib/**'
      - 'frontend/pubspec.*'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          xcodebuild -version
          cp .env.example .env
          flutter pub get --enforce-lockfile
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
