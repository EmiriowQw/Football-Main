name: basketvibe
description: "Football Day - Daily pickup football bookings"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.4
  skeletonizer: ^2.1.3

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^9.2.1

  # Functional Programming
  dartz: ^0.10.1

  # Navigation
  go_router: ^17.2.2

  # Maps & Location
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Media
  cached_network_image: ^3.4.1

  # Firebase and Google Sign-In
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^6.2.1

  # Environment
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true

  assets:
    - .env
    - assets/logo/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/football_day_logo.png"
